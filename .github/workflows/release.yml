name: Publish Today+ release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two merges replace the same release asset concurrently.
concurrency:
  group: today-plus-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version from plugin manifest
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("plugin/manifest.json"))["version"])')"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate and build the installable ZIP
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check plugin/plugin.js
          python scripts/package.py --tag "$TAG"

      - name: Prepare version-specific release notes
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          version = tag.removeprefix("v")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = next((i for i, line in enumerate(lines)
                          if line == f"## {version}" or line.startswith(f"## {version} ")), None)
          if heading is None:
              notes = f"Today+ {tag}. Download the tested installable ZIP from Assets.\n"
          else:
              section = []
              for line in lines[heading + 1:]:
                  if line.startswith("## "):
                      break
                  section.append(line)
              notes = f"{lines[heading]}\n\n" + "\n".join(section).strip() + "\n"
          Path("dist/release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish new version or refresh existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ASSET="dist/today-plus-super-productivity.zip"
          NAME="today-plus-super-productivity.zip"
          BACKUP="$RUNNER_TEMP/today-plus-previous"
          VERIFY="$RUNNER_TEMP/today-plus-verified"
          mkdir -p "$BACKUP" "$VERIFY"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release $TAG: compare with latest tested ZIP"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$NAME"; then
              # Keep a rollback copy: --clobber deletes the previous asset first.
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir "$BACKUP"
              if cmp -s "$ASSET" "$BACKUP/$NAME"; then
                echo "ZIP is unchanged; nothing to publish."
                exit 0
              fi
            fi

            if ! gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"; then
              echo "::error::Release upload failed. Attempting to restore previous asset."
              if test -f "$BACKUP/$NAME"; then
                gh release upload "$TAG" "$BACKUP/$NAME" --clobber --repo "$GITHUB_REPOSITORY" || true
              fi
              exit 1
            fi
          else
            echo "Creating release $TAG for a new manifest version"
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Today+ $TAG" --latest \
              --notes-file dist/release-notes.md
          fi

          # Check the actual public release asset, not merely the build output.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir "$VERIFY"
          cmp "$ASSET" "$VERIFY/$NAME"
          echo "Release ZIP verified byte-for-byte."

          # Preserve existing notes; update only the automated build footer.
          NOTES="$RUNNER_TEMP/today-plus-release-notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > "$NOTES"
          export NOTES ASSET_SHA256
          ASSET_SHA256="$(sha256sum "$ASSET" | cut -d ' ' -f1)"
          export ASSET_SHA256
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(os.environ["NOTES"])
          marker = "\n\n<!-- today-plus-automated-build -->"
          original = path.read_text(encoding="utf-8").split(marker, 1)[0].rstrip()
          sha = os.environ["GITHUB_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          footer = (
              f"{marker}\n"
              f"**Latest tested ZIP:** built from [`{sha[:12]}`](https://github.com/{repo}/commit/{sha}) "
              f"on {timestamp}. SHA-256: `{os.environ['ASSET_SHA256']}`.\n\n"
              "_Download the ZIP under Assets. GitHub's autogenerated source archives stay pinned "
              "to the original release tag, which may point to an earlier commit._\n"
          )
          path.write_text(original + footer, encoding="utf-8")
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
          echo "Published and documented tested $TAG build."
