name: Check Today+ plugin

on:
  push:
    branches: [main]
  pull_request:

# Same-repository design PRs can commit freshly rendered documentation screenshots.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manifest, actions and installable ZIP
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/package.py
          node --check plugin/plugin.js
      - name: Install browser testing and screenshot tools
        run: |
          python -m pip install playwright==1.57.0 Pillow
          python -m playwright install --with-deps chromium
      - name: Verify task, habit, mobile and touch interactions
        run: |
          python tests/browser_task_view_check.py
          python tests/integration_check.py
          python tests/browser_check.py
      - name: Regenerate documentary screenshots with host font
        run: python scripts/capture_neo_screenshots.py
      - name: Upload review screenshots and ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: today-plus-neo-zen-preview
          path: |
            docs/screenshots/*.webp
            dist/today-plus-super-productivity.zip
          if-no-files-found: warn
      - name: Commit refreshed screenshots to same-repo PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/today-plus-tasks-desktop-v1.1.0.webp \
                  docs/screenshots/today-plus-tasks-phone-v1.1.0.webp \
                  docs/screenshots/small-phone.webp docs/screenshots/log-time.webp
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh NEO-Zen Today+ screenshots"
            git push origin "HEAD:$HEAD_REF"
          else
            echo "Screenshots are already current."
          fi
